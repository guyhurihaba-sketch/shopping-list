<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רשימת קניות חכמה בעברית — ניהול קניות משותף בחינם</title>
<meta name="description" content="רשימת קניות חכמה וחינמית בעברית: נהלו רשימת קניות משותפת עם המשפחה בזמן אמת, סרקו ברקודים וחשבוניות אוטומטית, קבלו התראות על מוצרי יסוד בפיקוח מחירים, והשוו מחירים בין רשתות השיווק הגדולות בארץ.">
<meta name="keywords" content="רשימת קניות, רשימת קניות חכמה, רשימת קניות משפחתית, אפליקציית קניות, ניהול קניות, סריקת ברקוד, השוואת מחירים">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://guyhurihaba-sketch.github.io/shopping-list/">
<meta property="og:type" content="website">
<meta property="og:title" content="רשימת קניות חכמה בעברית — ניהול קניות משותף בחינם">
<meta property="og:description" content="נהלו רשימת קניות משותפת עם המשפחה, סרקו ברקודים ואת ברקוד הקבלה, והשוו מחירים בין הרשתות הגדולות בארץ. חינם לחלוטין.">

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Firebase: only used when this page runs outside Claude (e.g. hosted on
     GitHub Pages) and a real config is filled in below. Harmless otherwise. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<!-- ZXing: cross-browser barcode scanning (works on iPhone/Safari and
     desktop too, unlike the native BarcodeDetector API which is
     Android-Chrome-only). -->
<script src="https://unpkg.com/@zxing/library@latest"></script>
<script src="https://unpkg.com/@zxing/browser@latest"></script>
<!-- Tesseract.js: on-device OCR for the receipt scanner -->
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --bg: #23241f;
    --panel: #2c2d26;
    --chalk: #f2ede2;
    --chalk-dim: #b9b6a9;
    --avocado: #8fae52;
    --avocado-dim: #5c7038;
    --mustard: #d8a934;
    --tomato: #c1523a;
    --line: #45463c;
    --stamp-in: #7a9a4a;
    --stamp-needed: #9e1b41;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:24px 16px 60px;
    background:
      radial-gradient(circle at 20% -10%, #33352c 0%, var(--bg) 55%);
    font-family:'Rubik', sans-serif;
    color: var(--chalk);
    min-height:100vh;
  }
  .board{
    max-width:520px;
    margin:0 auto;
    background: var(--panel);
    border-radius:18px;
    padding:22px 20px 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.03);
    position:relative;
    overflow:hidden;
  }
  .board::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 34px);
    pointer-events:none;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:6px;
    position:relative;
  }
  h1{
    font-size:1.5em;
    font-weight:800;
    margin:0;
    letter-spacing:0.3px;
  }
  .sub{
    font-family:'Space Mono', monospace;
    font-size:0.72em;
    color: var(--chalk-dim);
    margin:0 0 18px;
  }
  .list-mode-bar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    background:#1c1d18;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:16px;
    font-size:0.8em;
    color: var(--chalk-dim);
  }
  .mode-btn{
    background: transparent;
    border:1px solid var(--avocado-dim);
    color: var(--avocado);
    padding:5px 10px;
    font-size:0.85em;
    border-radius:7px;
  }
  .mode-btn:hover{ background: rgba(143,174,82,0.12); border-color: var(--avocado); }
  .mode-btn.danger{ border-color: var(--tomato); color: var(--tomato); }
  .mode-btn.danger:hover{ background: rgba(158,27,65,0.12); border-color: var(--tomato); }
  .add-form{
    display:flex;
    gap:8px;
    margin-bottom:20px;
    position:relative;
  }
  input[type="text"]{
    flex:1;
    padding:8px 12px;
    border-radius:9px;
    border:1px solid var(--line);
    background:#1c1d18;
    color:var(--chalk);
    font-family:'Rubik', sans-serif;
    font-size:0.88em;
    outline:none;
  }
  input[type="text"]:focus{ border-color: var(--avocado); }
  input[type="text"]::placeholder{ color:#6b6a5f; }
  button{
    font-family:'Rubik', sans-serif;
    font-weight:700;
    border:none;
    border-radius:10px;
    cursor:pointer;
  }
  .btn-add{
    background: var(--avocado);
    color:#1c2410;
    padding:0 20px;
    font-size:0.95em;
  }
  .btn-add:hover{ background:#9fbf63; }

  .qty-picker{
    display:flex;
    align-items:center;
    border:1px solid var(--line);
    border-radius:10px;
    background:#1c1d18;
    overflow:hidden;
    flex-shrink:0;
  }
  .qty-picker input{
    width:26px;
    text-align:center;
    border:none;
    background:transparent;
    color: var(--chalk);
    font-family:'Space Mono', monospace;
    font-size:0.85em;
    padding:0;
    outline:none;
    -moz-appearance:textfield;
  }
  .qty-picker input::-webkit-outer-spin-button,
  .qty-picker input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .qty-step{
    width:24px;
    height:100%;
    padding:8px 0;
    background:transparent;
    color: var(--chalk-dim);
    font-size:0.9em;
    line-height:1;
  }
  .qty-step:hover{ background: rgba(143,174,82,0.15); color: var(--avocado); }

  .btn-share{
    display:block;
    width:100%;
    background: transparent;
    border:1px solid var(--avocado-dim);
    color: var(--avocado);
    padding:10px 14px;
    font-size:0.85em;
    margin-bottom:18px;
  }
  .btn-share:hover{ background: rgba(143,174,82,0.12); border-color: var(--avocado); }

  .btn-scan{
    display:block;
    width:100%;
    background: transparent;
    border:1px solid var(--mustard);
    color: var(--mustard);
    padding:10px 14px;
    font-size:0.85em;
    margin-bottom:10px;
  }
  .btn-scan:hover{ background: rgba(216,169,52,0.12); }

  .scan-overlay{
    display:none;
    position:fixed;
    inset:0;
    background: rgba(10,10,8,0.92);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .scan-overlay.open{ display:flex; }
  .scan-box{
    position:relative;
    width:100%;
    max-width:420px;
    background: var(--panel);
    border-radius:16px;
    padding:16px;
    text-align:center;
  }
  .scan-box video{
    width:100%;
    border-radius:10px;
    background:#000;
    max-height:60vh;
    object-fit:cover;
  }
  .scan-frame{
    position:absolute;
    top:50%;
    left:50%;
    transform: translate(-50%, -50%);
    width:70%;
    height:90px;
    border:2px solid var(--avocado);
    border-radius:8px;
    pointer-events:none;
    box-shadow: 0 0 0 999px rgba(0,0,0,0.35);
  }
  .scan-status{
    color: var(--chalk-dim);
    font-size:0.85em;
    margin:12px 0;
    min-height:1.2em;
  }
  .btn-scan-close{
    background: var(--tomato);
    color: var(--chalk);
    padding:9px 18px;
    font-size:0.85em;
  }

  .receipt-box{
    max-height:85vh;
    overflow-y:auto;
  }
  #receiptReview{
    text-align:right;
    margin-top:10px;
  }
  .receipt-line{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 6px;
    border-bottom:1px solid var(--line);
  }
  .receipt-line input[type="checkbox"]{
    width:18px;
    height:18px;
    flex-shrink:0;
    accent-color: var(--avocado);
  }
  .receipt-name{
    flex:1;
    min-width:0;
    padding:7px 9px;
    border-radius:7px;
    border:1px solid var(--line);
    background:#1c1d18;
    color: var(--chalk);
    font-family:'Rubik', sans-serif;
    font-size:0.85em;
  }
  .receipt-price{
    width:64px;
    padding:7px 6px;
    border-radius:7px;
    border:1px solid var(--line);
    background:#1c1d18;
    color: var(--mustard);
    font-family:'Space Mono', monospace;
    font-size:0.85em;
    text-align:center;
  }
  .receipt-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .receipt-actions .btn-add{
    flex:1;
    padding:10px;
  }
  .receipt-actions .btn-scan-close{
    flex:1;
  }

  .form-error{
    display:none;
    color: var(--tomato);
    font-size:0.78em;
    margin:-12px 0 14px;
  }
  .category-extra{
    display:none;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
    font-size:0.82em;
    color: var(--chalk-dim);
  }
  .category-extra select,
  .category-extra input{
    padding:6px 9px;
    border-radius:7px;
    border:1px solid var(--line);
    background:#1c1d18;
    color: var(--chalk);
    font-family:'Rubik', sans-serif;
    font-size:0.85em;
    outline:none;
    flex:1;
    max-width:110px;
  }
  .category-extra select:focus,
  .category-extra input:focus{ border-color: var(--avocado); }
  .percent-mark{
    color: var(--mustard);
    font-family:'Space Mono', monospace;
    font-weight:700;
    min-width:14px;
  }

  .suggestion{
    display:none;
    align-items:center;
    gap:8px;
    font-size:0.8em;
    color: var(--chalk-dim);
    margin:-12px 0 14px;
  }
  .suggestion button{
    background: var(--mustard);
    color:#2b2308;
    padding:4px 10px;
    font-size:0.9em;
    border-radius:6px;
  }
  .suggestion button:hover{ background:#e6bd50; }

  .stock-toggle{
    display:block;
    width:100%;
    text-align:center;
    background:transparent;
    border:1px dashed var(--line);
    color: var(--chalk-dim);
    padding:8px;
    font-size:0.78em;
    margin:6px 0 4px;
    font-family:'Space Mono', monospace;
  }
  .stock-toggle:hover{ border-color: var(--chalk-dim); color: var(--chalk); }

  .section-label{
    font-family:'Space Mono', monospace;
    font-size:0.7em;
    letter-spacing:1.5px;
    color: var(--chalk-dim);
    margin: 18px 0 8px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--line);
  }

  .item-card{
    background:#1c1d18;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 14px;
    margin-bottom:10px;
    position:relative;
    transition: border-color .2s ease;
  }
  .item-card.is-needed{ border-color: rgba(158,27,65,0.55); }

  .item-top{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-bottom:10px;
  }
  .item-title-wrap{
    flex:1;
  }
  .item-title{
    font-weight:700;
    font-size:1.08em;
  }
  .item-price{
    font-family:'Space Mono', monospace;
    font-size:0.85em;
    color: var(--mustard);
    white-space:nowrap;
    text-align:left;
  }
  .price-trend{
    display:block;
    font-size:0.72em;
    margin-top:2px;
    font-weight:700;
  }
  .price-trend.up{ color: var(--tomato); }
  .price-trend.down{ color: var(--avocado); }

  .buy-box{
    position:relative;
    flex-shrink:0;
    width:24px;
    height:24px;
    margin-top:2px;
    cursor:pointer;
  }
  .buy-box-mark{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1.5px solid var(--line);
    border-radius:6px;
    color:transparent;
    font-size:0.85em;
    font-weight:700;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .buy-box:hover .buy-box-mark{ border-color: var(--avocado); color: var(--avocado); }
  .buy-box:active .buy-box-mark{
    background: var(--avocado);
    border-color: var(--avocado);
    color:#1c2410;
  }
  .buy-box:focus-visible .buy-box-mark{ border-color: var(--mustard); outline:none; }

  .qty-badge{
    display:inline-block;
    font-family:'Space Mono', monospace;
    font-size:0.72em;
    font-weight:700;
    color: var(--chalk);
    background: var(--avocado-dim);
    padding:1px 7px;
    border-radius:5px;
    margin-inline-start:6px;
  }

  .stamp{
    display:inline-block;
    font-family:'Space Mono', monospace;
    font-size:0.62em;
    font-weight:700;
    letter-spacing:0.5px;
    padding:2px 8px;
    border-radius:5px;
    transform: rotate(-3deg);
    margin-inline-start:8px;
    border:1.5px solid;
  }
  .stamp.in_stock{ color: var(--stamp-in); border-color: var(--stamp-in); }
  .stamp.needed{ color: var(--stamp-needed); border-color: var(--stamp-needed); }

  .gauge-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .gauge{
    flex:1;
    height:8px;
    border-radius:6px;
    background:#33352c;
    overflow:hidden;
    position:relative;
  }
  .gauge-fill{
    height:100%;
    border-radius:6px;
    transition: width .3s ease;
  }
  .gauge-pct{
    font-family:'Space Mono', monospace;
    font-size:0.72em;
    color: var(--chalk-dim);
    width:38px;
    text-align:left;
  }
  .item-meta{
    font-size:0.78em;
    color: var(--chalk-dim);
    margin-bottom:12px;
  }
  .price-control{
    font-size:0.76em;
    color: var(--mustard);
    background: rgba(216,169,52,0.1);
    border: 1px solid rgba(216,169,52,0.3);
    border-radius:8px;
    padding:6px 10px;
    margin-bottom:12px;
    line-height:1.5;
  }
  .price-control.over{
    color: var(--tomato);
    background: rgba(158,27,65,0.1);
    border-color: rgba(158,27,65,0.4);
  }
  .community-price{
    font-size:0.76em;
    color: var(--avocado);
    background: rgba(143,174,82,0.1);
    border: 1px solid rgba(143,174,82,0.3);
    border-radius:8px;
    padding:6px 10px;
    margin-bottom:12px;
    line-height:1.5;
  }
  .item-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .btn-toggle{
    background:transparent;
    border:1px solid var(--line);
    color: var(--chalk-dim);
    padding:8px 12px;
    font-size:0.82em;
  }
  .btn-toggle:hover{ border-color: var(--mustard); color: var(--mustard); }
  .btn-del{
    background:transparent;
    border:1px solid var(--line);
    color: var(--chalk-dim);
    padding:8px 10px;
    font-size:0.82em;
  }
  .btn-del:hover{ border-color: var(--tomato); color: var(--tomato); }

  .empty{
    text-align:center;
    color: var(--chalk-dim);
    font-size:0.85em;
    padding:20px 0;
  }
  .status-line{
    text-align:center;
    font-family:'Space Mono', monospace;
    font-size:0.68em;
    color:#6b6a5f;
    margin-top:18px;
  }

  /* accessibility: font-size scaling applied to the root element, cascades
     through the app's em-based sizing */
  html.a11y-large{ font-size:120%; }
  html.a11y-xlarge{ font-size:145%; }

  .a11y-widget{
    position:fixed;
    bottom:20px;
    left:20px;
    z-index:2000;
  }
  .a11y-toggle{
    width:52px;
    height:52px;
    border-radius:50%;
    background: var(--avocado);
    color:#1c2410;
    font-size:1.4em;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    border:none;
    cursor:pointer;
  }
  .a11y-toggle:hover{ background:#9fbf63; }
  .a11y-menu{
    display:none;
    position:absolute;
    bottom:64px;
    left:0;
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    min-width:190px;
  }
  .a11y-menu.open{ display:flex; flex-direction:column; gap:6px; }
  .a11y-menu button{
    background:#1c1d18;
    color: var(--chalk);
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 12px;
    font-size:0.9em;
    text-align:right;
    cursor:pointer;
  }
  .a11y-menu button:hover{ border-color: var(--avocado); color: var(--avocado); }

  .ai-widget{
    position:fixed;
    bottom:20px;
    right:20px;
    z-index:2000;
  }
  .ai-toggle{
    width:52px;
    height:52px;
    border-radius:50%;
    background: var(--mustard);
    color:#2b2308;
    font-size:1.5em;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    border:none;
    cursor:pointer;
  }
  .ai-toggle:hover{ background:#e6bd50; }
  .ai-panel{
    display:none;
    position:absolute;
    bottom:64px;
    right:0;
    width:min(340px, 88vw);
    height:min(440px, 70vh);
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow: 0 12px 34px rgba(0,0,0,0.5);
    flex-direction:column;
    overflow:hidden;
  }
  .ai-panel.open{ display:flex; }
  .ai-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    font-size:0.9em;
    font-weight:700;
    color: var(--chalk);
  }
  .ai-close{
    background:transparent;
    border:none;
    color: var(--chalk-dim);
    font-size:1em;
    cursor:pointer;
    padding:2px 6px;
  }
  .ai-close:hover{ color: var(--tomato); }
  .ai-messages{
    flex:1;
    overflow-y:auto;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .ai-msg{
    max-width:85%;
    padding:8px 11px;
    border-radius:10px;
    font-size:0.85em;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .ai-msg.assistant{
    align-self:flex-start;
    background:#1c1d18;
    color: var(--chalk);
    border:1px solid var(--line);
  }
  .ai-msg.user{
    align-self:flex-end;
    background: var(--avocado-dim);
    color: var(--chalk);
  }
  .ai-msg.loading{ color: var(--chalk-dim); font-style:italic; }
  .ai-input-row{
    display:flex;
    gap:6px;
    padding:10px;
    border-top:1px solid var(--line);
  }
  .ai-input-row input{
    flex:1;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#1c1d18;
    color: var(--chalk);
    font-family:'Rubik', sans-serif;
    font-size:0.85em;
    outline:none;
  }
  .ai-input-row button{
    background: var(--mustard);
    color:#2b2308;
    padding:8px 14px;
    border-radius:8px;
    font-size:0.85em;
  }
  .ai-input-row button:hover{ background:#e6bd50; }

  .ai-suggestions{
    align-self:flex-start;
    max-width:90%;
    background:#1c1d18;
    border:1px solid var(--avocado-dim);
    border-radius:10px;
    padding:10px;
    font-size:0.82em;
  }

    margin-bottom:6px;

  .ai-suggestion-line{
    display:flex;

<body>

<div class="board">
  <header>
    <h1>🧺 רשימת קניות חכמה</h1>
  </header>
  <p class="sub">מעקב מלאי לפי קצב צריכה ממוצע</p>

  <div class="list-mode-bar" id="listModeBar"></div>

  <div class="add-form">

      <button type="button" class="qty-step" onclick="stepQuantity(-1)">−</button>

  <button class="btn-scan" onclick="openScanner()">📷 סרוק ברקוד / QR</button>

  <input type="file" id="receiptFileInput" accept="image/*" capture="environment" style="display:none" onchange="handleReceiptFile(event)">

<div class="a11y-widget">

      <button onclick="sendAiMessage()">שלח</button>
    </div>
  </div>

<script>
  let items = [];
  let loaded = false;
  let showStock = false; // bought items stay hidden until you choose to reveal them

  const STORAGE_KEY = 'shopping-list:items';

  // --- list mode: personal (only this device) vs family (shared via a link) --
  // Default is personal - nobody sees your list unless you explicitly create
  // and share a family link. Opening that link switches the opener into the
  // same shared family list instead of their own personal one.
  function getUrlParam(name){
    return new URLSearchParams(window.location.search).get(name);
  }
  function generateCode(len){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no ambiguous chars
    let out = '';
    for(let i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
    return out;
  }

  let listMode = 'personal';
  let familyCode = null;
  let personalDeviceId = null;

  const urlFamilyCode = getUrlParam('family');
  if(urlFamilyCode){
    listMode = 'family';
    familyCode = urlFamilyCode.toUpperCase();
  }

  if(typeof window.storage === 'undefined'){
    // hosted site: remember a personal device id across visits (safe here -
    // this branch never runs inside the Claude artifact sandbox)
    personalDeviceId = localStorage.getItem('shopping-list-device-id');
    if(!personalDeviceId){
      personalDeviceId = generateCode(4) + generateCode(4);
      localStorage.setItem('shopping-list-device-id', personalDeviceId);
    }
    if(listMode === 'family'){
      // remember the last family code used, so a plain revisit without the
      // ?family= param can still offer to rejoin it
      localStorage.setItem('shopping-list-last-family-code', familyCode);
    }
  }

  function effectiveKey(suffix){
    const base = listMode === 'family' ? `shopping-list-family:${familyCode}` : `shopping-list-personal:${personalDeviceId || 'me'}`;
    return suffix ? `${base}:${suffix}` : base;
  }

  let deviceIdReady = null;
  async function ensureDeviceId(){
    if(personalDeviceId) return personalDeviceId;
    if(deviceIdReady) return deviceIdReady; // avoid kicking off multiple lookups in parallel

    deviceIdReady = (async () => {
      if(typeof window.storage !== 'undefined'){
        // inside Claude: use a personal (non-shared) bucket to remember this
        try{
          const res = await window.storage.get('shopping-list-device-id', false);
          if(res && res.value){ personalDeviceId = res.value; return personalDeviceId; }
        } catch(e){ /* not set yet */ }
        personalDeviceId = generateCode(4) + generateCode(4);
        try{ await window.storage.set('shopping-list-device-id', personalDeviceId, false); } catch(e){}
      }
      return personalDeviceId;
    })();

    return deviceIdReady;
  }

  // --- storage backend ------------------------------------------------
  // This same file works two ways:
  // 1) Inside Claude (as this artifact) -> uses Claude's built-in shared
  //    storage automatically, no setup needed.
  // 2) Hosted elsewhere (e.g. GitHub Pages) -> uses a free Firebase
  //    Realtime Database instead, which ALSO syncs live between everyone
  //    who has the page open. To enable this, replace the placeholder
  //    values below with your own Firebase project's config (see the
  //    setup guide for where to find these).
  const firebaseConfig = {
    apiKey: "AIzaSyDXVvKOYITLEhaqGECZ9jMtWPjQrkTo6Qk",
    authDomain: "shopping-list-gh.firebaseapp.com",
    databaseURL: "https://shopping-list-gh-default-rtdb.firebaseio.com",
    projectId: "shopping-list-gh",
    storageBucket: "shopping-list-gh.firebasestorage.app",
    messagingSenderId: "27345167500",
    appId: "1:27345167500:web:2a0fc8b0ee8e08d79087a9"
  };

  const usingClaudeStorage = (typeof window.storage !== 'undefined');
  let firebaseDb = null;
  let firebaseReady = false;
  let firebaseInitError = null;

  if(!usingClaudeStorage && firebaseConfig.apiKey !== 'YOUR_API_KEY'){
    if(typeof firebase === 'undefined'){
      firebaseInitError = 'ספריית Firebase לא נטענה (בדקו חיבור לאינטרנט, או שחוסם פרסומות/פרטיות חסם את gstatic.com).';
    } else {
      try{
        firebase.initializeApp(firebaseConfig);
        firebaseDb = firebase.database();
        firebaseReady = true;
      } catch(e){
        firebaseInitError = 'שגיאת אתחול Firebase: ' + (e && e.message ? e.message : e);
        console.error('שגיאת אתחול Firebase:', e);
      }
    }
  }

  const SEED_ITEMS = [
    { id: "1", name: "חלב 3%", status: "in_stock", lastPurchaseDate: "2026-07-25", averageDays: 5, lastPrice: 7.20, quantity: 1 },
    { id: "2", name: "קפה נמס", status: "in_stock", lastPurchaseDate: "2026-07-01", averageDays: 20, lastPrice: 35.00, quantity: 1 }
  ];

  function ingestRawItems(raw){
    const arr = Array.isArray(raw) ? raw : Object.values(raw || {});
    return arr.map((i, idx) => sanitizeItem(i, Date.now() + idx)).filter(Boolean);
  }

  let itemsFirebaseRef = null;

  async function loadItems(){
    if(itemsFirebaseRef){ itemsFirebaseRef.off(); itemsFirebaseRef = null; } // detach any previous mode's listener

    if(usingClaudeStorage){
      try{
        const res = await window.storage.get(effectiveKey('items'), listMode === 'family');
        if(res && res.value){
          items = ingestRawItems(JSON.parse(res.value));
        } else {
          items = listMode === 'family' ? [] : SEED_ITEMS.slice();
          await persistItems();
        }
      } catch(e){
        console.error('שגיאת טעינה:', e);
        items = [];
      }
      loaded = true;
      renderListModeBar();
      renderItems();

    } else if(firebaseReady){
      itemsFirebaseRef = firebaseDb.ref(effectiveKey('items'));
      itemsFirebaseRef.on('value', snapshot => {
        const val = snapshot.val();
        if(val){
          items = ingestRawItems(val);
        } else {
          items = listMode === 'family' ? [] : SEED_ITEMS.slice();
          persistItems(); // seed this list once, on whoever opens it first
        }
        loaded = true;
        renderListModeBar();
        renderItems();
      }, err => {
        console.error('שגיאת Firebase:', err);
        items = [];
        loaded = true;
        document.getElementById('statusLine').textContent = '❌ שגיאת Firebase: ' + (err && err.message ? err.message : err);
        renderItems();
      });

    } else {
      // no backend configured at all -> works for this session only
      items = SEED_ITEMS.slice();
      loaded = true;
      document.getElementById('statusLine').textContent = firebaseInitError
        ? '❌ ' + firebaseInitError
        : '⚠️ אין שמירה מוגדרת — הנתונים לא יישמרו אחרי סגירת הדף';
      renderItems();
    }
  }

  async function persistItems(){
    if(usingClaudeStorage){
      try{
        const result = await window.storage.set(effectiveKey('items'), JSON.stringify(items), listMode === 'family');
        if(!result){ console.error('שמירה נכשלה'); }
      } catch(e){
        console.error('שגיאת שמירה:', e);
      }
    } else if(firebaseReady){
      try{
        await firebaseDb.ref(effectiveKey('items')).set(items);
      } catch(e){
        console.error('שגיאת שמירה ל-Firebase:', e);
      }
    }
    // else: nothing configured, changes just stay in memory for this session
  }

  // --- learned barcode -> name mappings ------------------------------
  // remembers manual corrections after a scan lookup failed or was wrong,
  // so scanning the same physical product again is instant next time
  let barcodeNames = {};
  let barcodeFirebaseRef = null;

  async function loadBarcodeNames(){
    if(barcodeFirebaseRef){ barcodeFirebaseRef.off(); barcodeFirebaseRef = null; }

    if(usingClaudeStorage){
      try{
        const res = await window.storage.get(effectiveKey('barcodes'), listMode === 'family');
        if(res && res.value) barcodeNames = JSON.parse(res.value);
        else barcodeNames = {};
      } catch(e){
        barcodeNames = {}; // no saved mappings yet - fine, start empty
      }
    } else if(firebaseReady){
      barcodeFirebaseRef = firebaseDb.ref(effectiveKey('barcodes'));
      barcodeFirebaseRef.on('value', snapshot => {
        barcodeNames = snapshot.val() || {};
      });
    }
  }

  async function persistBarcodeNames(){
    if(usingClaudeStorage){
      try{
        await window.storage.set(effectiveKey('barcodes'), JSON.stringify(barcodeNames), listMode === 'family');
      } catch(e){
        console.error('שגיאת שמירת מאגר ברקודים:', e);
      }
    } else if(firebaseReady){
      try{
        await firebaseDb.ref(effectiveKey('barcodes')).set(barcodeNames);
      } catch(e){
        console.error('שגיאת שמירת מאגר ברקודים ל-Firebase:', e);
      }
    }
  }

  // --- community prices --------------------------------------------------
  // users can opt in to share what they actually paid for a product; this
  // is a global pool (not scoped to personal/family list) so everyone using
  // the app contributes to and benefits from the same reference prices
  const COMMUNITY_KEY = 'shopping-list-community-prices';
  let communityPrices = {}; // { normalizedName: [{price, ts}, ...] }
  let communityFirebaseRef = null;

  function normalizeProductName(name){
    return (name || '').trim().toLowerCase();
  }

  async function loadCommunityPrices(){
    if(communityFirebaseRef){ communityFirebaseRef.off(); communityFirebaseRef = null; }

    if(usingClaudeStorage){
      try{
        const res = await window.storage.get(COMMUNITY_KEY, true);
        if(res && res.value) communityPrices = JSON.parse(res.value);
      } catch(e){
        communityPrices = {}; // nothing shared yet - fine, start empty
      }
    } else if(firebaseReady){
      communityFirebaseRef = firebaseDb.ref(COMMUNITY_KEY);
      communityFirebaseRef.on('value', snapshot => {
        communityPrices = snapshot.val() || {};
        if(loaded) renderItems(); // refresh price displays as new reports come in
      });
    }
  }

  async function persistCommunityPrices(){
    if(usingClaudeStorage){
      try{
        await window.storage.set(COMMUNITY_KEY, JSON.stringify(communityPrices), true);
      } catch(e){
        console.error('שגיאת שמירת מחירי קהילה:', e);
      }
    } else if(firebaseReady){
      try{
        await firebaseDb.ref(COMMUNITY_KEY).set(communityPrices);
      } catch(e){
        console.error('שגיאת שמירת מחירי קהילה ל-Firebase:', e);
      }
    }
  }

  function median(nums){
    const sorted = [...nums].sort((a,b) => a-b);
    const mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid-1] + sorted[mid]) / 2;
  }

  function getCommunityStats(name){
    const key = normalizeProductName(name);
    const allReports = communityPrices[key];
    if(!allReports || allReports.length === 0) return null;

    // only count reports from roughly the last 6 months, so stale prices
    // don't keep dragging down/up a figure that should reflect today
    const cutoff = Date.now() - (180 * 24 * 60 * 60 * 1000);
    const recent = allReports.filter(r => !r.ts || r.ts >= cutoff);
    if(recent.length === 0) return null;

    const prices = recent.map(r => r.price);
    return {
      median: median(prices),
      count: prices.length,
      min: Math.min(...prices),
      max: Math.max(...prices)
    };
  }

  async function shareCommunityPrice(id){
    const item = items.find(i => i.id === id);
    if(!item) return;
    if(!item.lastPrice || item.lastPrice <= 0){
      alert('צריך קודם להזין מחיר למוצר הזה (דרך כפתור העריכה ✎) לפני שאפשר לשתף אותו.');
      return;
    }
    if(item.lastPrice < 0.5 || item.lastPrice > 2000){
      alert('המחיר הזה נראה לא סביר למוצר בודד (טווח סביר: 0.50₪ עד 2,000₪) - בדקו שוב לפני השיתוף.');
      return;
    }

    const deviceId = await ensureDeviceId();
    const key = normalizeProductName(item.name);
    if(!communityPrices[key]) communityPrices[key] = [];

    // one report per device per product per day, to slow down spam/flooding
    const oneDayAgo = Date.now() - (24 * 60 * 60 * 1000);
    const alreadyToday = deviceId && communityPrices[key].some(r => r.deviceId === deviceId && r.ts >= oneDayAgo);
    if(alreadyToday){
      showFormError('כבר שיתפתם מחיר למוצר הזה היום — אפשר לנסות שוב מחר.');
      return;
    }

    communityPrices[key].push({ price: item.lastPrice, ts: Date.now(), deviceId: deviceId || null });
    if(communityPrices[key].length > 200){
      communityPrices[key] = communityPrices[key].slice(-200); // cap history per product
    }

    persistCommunityPrices();
    renderItems();
    showFormError(`תודה! המחיר (₪${item.lastPrice.toFixed(2)}) שותף עם הקהילה עבור "${item.name}".`);
  }

  // --- switching between personal and family list mode ------------------
  function renderListModeBar(){
    const bar = document.getElementById('listModeBar');
    if(!bar) return;

    if(listMode === 'family'){
      bar.innerHTML = `
        <span>👥 רשימה משפחתית (קוד ${familyCode})</span>
        <button class="mode-btn" onclick="copyFamilyLink()">🔗 העתק קישור הזמנה</button>
        <button class="mode-btn" onclick="switchToPersonal()">🔒 לרשימה האישית שלי</button>
        <button class="mode-btn danger" onclick="resetList()">🗑️ אפס רשימה</button>
      `;
    } else {
      bar.innerHTML = `
        <span>🔒 רשימה אישית (רק אתם רואים אותה)</span>
        <button class="mode-btn" onclick="createFamilyList()">👥 שתפו עם המשפחה</button>
        <button class="mode-btn danger" onclick="resetList()">🗑️ אפס רשימה</button>
      `;
    }
  }

  function resetList(){
    if(items.length === 0){
      showFormError('הרשימה כבר ריקה.');
      return;
    }
    const label = listMode === 'family' ? 'הרשימה המשפחתית' : 'הרשימה האישית';
    const confirmed = confirm(`לאפס את ${label}? כל המוצרים יימחקו לצמיתות - זה לא הפיך.`);
    if(!confirmed) return;

    items = [];
    renderItems();
    persistItems();
    showFormError('הרשימה אופסה.');
  }

  function createFamilyList(){
    const code = generateCode(6);
    switchMode('family', code);
    copyFamilyLink();
  }

  function copyFamilyLink(){
    const url = new URL(window.location.href);
    url.searchParams.set('family', familyCode);
    const link = url.toString();

    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(() => {
        showFormError('קישור ההזמנה הועתק! שלחו אותו למי שתרצו שיצטרף לרשימה המשפחתית.');
      }).catch(() => {
        prompt('העתיקו את הקישור הזה ידנית:', link);
      });
    } else {
      prompt('העתיקו את הקישור הזה ידנית:', link);
    }
  }

  function switchToPersonal(){
    switchMode('personal', null);
  }

  function switchMode(mode, code){
    listMode = mode;
    familyCode = code;

    const url = new URL(window.location.href);
    if(mode === 'family'){
      url.searchParams.set('family', code);
      if(!usingClaudeStorage) localStorage.setItem('shopping-list-last-family-code', code);
    } else {
      url.searchParams.delete('family');
    }
    window.history.replaceState({}, '', url);

    loaded = false;
    document.getElementById('statusLine').textContent = 'טוען נתונים…';
    loadItems();
    loadBarcodeNames();
  }


  function sanitizeItem(raw, fallbackId){
    if(!raw || typeof raw !== 'object') return null;

    const name = typeof raw.name === 'string' ? raw.name.trim() : '';
    if(!name) return null; // an item with no name can't be fixed, drop it

    let lastPurchaseDate = raw.lastPurchaseDate;
    if(!lastPurchaseDate || isNaN(new Date(lastPurchaseDate).getTime())){
      lastPurchaseDate = new Date().toISOString().slice(0,10); // bad/missing date -> assume today
    }

    let averageDays = parseInt(raw.averageDays, 10);
    if(isNaN(averageDays) || averageDays <= 0) averageDays = 7; // invalid pace -> sensible default

    let lastPrice = parseFloat(raw.lastPrice);
    if(isNaN(lastPrice) || lastPrice < 0) lastPrice = 0;

    let quantity = parseInt(raw.quantity, 10);
    if(isNaN(quantity) || quantity < 1) quantity = 1;

    let previousPrice = parseFloat(raw.previousPrice);
    if(isNaN(previousPrice)) previousPrice = null;

    let status = raw.status === 'needed' ? 'needed' : 'in_stock';

    return {
      id: raw.id ? String(raw.id) : String(fallbackId),
      name, status, lastPurchaseDate, averageDays, lastPrice, quantity, previousPrice
    };
  }

  function showFormError(msg){
    const el = document.getElementById('formError');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  }

  // common Hebrew grocery items, used to suggest fixes for typos
  const COMMON_ITEMS = [
    'חלב', 'חלב 3%', 'חלב 1%', 'ביצים', 'לחם', 'לחם אחיד', 'קפה נמס', 'קפה טחון',
    'סוכר', 'מלח', 'קמח', 'שמן זית', 'שמן קנולה', 'אורז', 'פסטה', 'עגבניות',
    'מלפפונים', 'בצל', 'תפוחי אדמה', 'גבינה צהובה', 'גבינה לבנה', 'קוטג',
    'יוגורט', 'חמאה', 'טחינה', 'קטשופ', 'מיונז', 'חרדל', 'טונה', 'שימורי תירס',
    'שוקולד', 'ביסקוויטים', 'עוגיות', 'נייר טואלט', 'סבון כלים', 'אבקת כביסה',
    'מגבות נייר', 'שקיות אשפה', 'תה', 'מים מינרלים', 'מיץ תפוזים', 'בננות',
    'תפוחים', 'לימונים', 'עוף', 'בשר טחון', 'דגים'
  ];

  // "מוצרי יסוד בפיקוח מחירים" - a small, fixed list of government
  // price-controlled staples with a legal maximum price. Not barcode-based
  // (the regulation defines these by category, not GTIN), so matching is
  // done against the product name. Source: Ministry of Economy, snapshot
  // dates as published - worth refreshing occasionally as prices update.
  const PRICE_CONTROLLED = [
    { match: ['לחם אחיד', 'לחם כהה'], name: 'לחם אחיד (כהה)', pkg: 'כיכר 750 גרם', maxPrice: 7.30 },
    { match: ['לחם לבן'], name: 'לחם לבן', pkg: 'כיכר 750 גרם', maxPrice: 7.31 },
    { match: ['חלה', 'מאפה שמרים'], name: 'חלה / מאפה שמרים', pkg: 'כיכר 500 גרם', maxPrice: 6.56 },
    { match: ['מלח'], name: 'מלח מאכל', pkg: '1 ק"ג', maxPrice: 2.07 },
    { match: ['חלב 3%', 'חלב טרי 3%'], name: 'חלב טרי 3% שומן', pkg: 'שקית 1 ליטר', maxPrice: 6.21 },
    { match: ['חלב 1%', 'חלב טרי 1%'], name: 'חלב טרי 1% שומן', pkg: 'שקית 1 ליטר', maxPrice: 5.76 },
    { match: ['אשל', 'לבניה'], name: 'אשל / לבניה 4.5%', pkg: 'גביע 200 מ"ל', maxPrice: 1.93 },
    { match: ['גילה', 'לבן 3%', 'גיל '], name: 'גילה / לבן 3%', pkg: 'גביע 200 מ"ל', maxPrice: 1.72 },
    { match: ['שמנת חמוצה'], name: 'שמנת חמוצה 15%', pkg: 'גביע 200 מ"ל', maxPrice: 2.75 },
    { match: ['גבינה צהובה', 'עמק', 'גלבוע'], name: 'גבינה קשה (עמק/גלבוע)', pkg: 'ק"ג', maxPrice: 51.14 },
    { match: ['גבינה לבנה', 'קוטג'], name: 'גבינה לבנה / סקי 5%', pkg: '250 גרם', maxPrice: 5.68 },
    { match: ['ביצים', 'ביצי מאכל'], name: 'ביצי מאכל (תריסר)', pkg: '12 יחידות', maxPrice: 15.19 }
  ];

  function findPriceControlMatch(name){
    const clean = (name || '').trim();
    if(!clean) return null;
    for(const entry of PRICE_CONTROLLED){
      if(entry.match.some(term => clean.includes(term))){
        return entry;
      }
    }
    return null;
  }

  // category detection: typing a product name auto-shows the field that
  // makes sense for it (fat % for dairy, kg for meat, grams for produce)
  const DAIRY_KEYWORDS = ['חלב', 'גבינה', 'יוגורט', 'קוטג', 'חמאה', 'שמנת', 'לבן', 'לאבנה'];
  const MEAT_KEYWORDS = ['בשר', 'עוף', 'בקר', 'כבש', 'הודו', 'נקניק', 'קציצות', 'סטייק', 'כבד', 'דג', 'דגים', 'סלמון', 'טחון'];
  const WEIGHED_KEYWORDS = [
    'עגבניות', 'עגבנייה', 'מלפפון', 'מלפפונים', 'בצל', 'תפוח אדמה', 'תפוחי אדמה',
    'גזר', 'פלפל', 'חסה', 'קמח', 'סוכר', 'אורז', 'תמרים', 'אגוזים', 'שקדים',
    'פיצוחים', 'תפוחים', 'ענבים', 'תות', 'תותים', 'קישוא', 'קישואים', 'חציל', 'חצילים'
  ];

  function detectCategory(name){
    const clean = name.trim();
    if(!clean) return null;
    const hasWord = list => list.some(w => clean.includes(w));

    // meat/fish checked first: "בשר טחון" would otherwise also match nothing
    // dairy-specific, so order avoids ambiguous overlaps
    if(hasWord(MEAT_KEYWORDS)) return 'meat';
    if(hasWord(DAIRY_KEYWORDS)) return 'dairy';
    if(hasWord(WEIGHED_KEYWORDS)) return 'weighed';
    return null;
  }

  function renderCategoryExtra(){
    const nameVal = document.getElementById('itemName').value;
    const box = document.getElementById('categoryExtra');
    const category = detectCategory(nameVal);

    if(category === 'dairy'){
      box.style.display = 'flex';
      box.innerHTML = `
        <span>אחוז שומן:</span>
        <input type="number" id="categoryValue" step="0.5" min="0" max="100" placeholder="לדוגמה: 3" oninput="updatePercentMark()">
        <span class="percent-mark" id="percentMark"></span>`;
    } else if(category === 'meat'){
      box.style.display = 'flex';
      box.innerHTML = `
        <span>משקל (ק"ג):</span>
        <input type="number" id="categoryValue" step="0.1" min="0" placeholder="לדוגמה: 1">`;
    } else if(category === 'weighed'){
      box.style.display = 'flex';
      box.innerHTML = `
        <span>משקל (גרם):</span>
        <input type="number" id="categoryValue" step="10" min="0" placeholder="לדוגמה: 500">`;
    } else {
      box.style.display = 'none';
      box.innerHTML = '';
    }
  }

  function updatePercentMark(){
    const el = document.getElementById('categoryValue');
    const mark = document.getElementById('percentMark');
    if(!el || !mark) return;
    mark.textContent = el.value.trim() !== '' ? '%' : '';
  }

  function categorySuffix(){
    const el = document.getElementById('categoryValue');
    if(!el) return '';
    const val = el.value.toString().trim();
    if(!val) return '';

    const category = detectCategory(document.getElementById('itemName').value);
    if(category === 'dairy') return ` ${val}%`;
    if(category === 'meat') return ` ${val} ק"ג`;
    if(category === 'weighed') return ` ${val} גרם`;
    return '';
  }

  function levenshtein(a, b){
    a = a.trim(); b = b.trim();
    const m = a.length, n = b.length;
    if(m === 0) return n;
    if(n === 0) return m;
    const dp = Array.from({length: m+1}, () => new Array(n+1).fill(0));
    for(let i=0;i<=m;i++) dp[i][0] = i;
    for(let j=0;j<=n;j++) dp[0][j] = j;
    for(let i=1;i<=m;i++){
      for(let j=1;j<=n;j++){
        const cost = a[i-1] === b[j-1] ? 0 : 1;
        dp[i][j] = Math.min(
          dp[i-1][j] + 1,
          dp[i][j-1] + 1,
          dp[i-1][j-1] + cost
        );
      }
    }
    return dp[m][n];
  }

  // build a flat word-level dictionary: every distinct word that appears in
  // the common-items list or in the words already used, so a typo anywhere
  // in a multi-word product name (not just the first word) can be caught
  function buildWordDictionary(){
    const words = new Set();
    for(const phrase of COMMON_ITEMS){
      phrase.split(/\s+/).forEach(w => { if(w) words.add(w); });
    }
    for(const it of items){
      it.name.split(/\s+/).forEach(w => { if(w) words.add(w); });
    }
    return [...words];
  }

  function closestWord(word, dictionary){
    const clean = word.trim();
    if(clean.length < 2) return null;

    let best = null;
    let bestDist = Infinity;
    for(const candidate of dictionary){
      if(candidate.toLowerCase() === clean.toLowerCase()) return null; // already correct
      const dist = levenshtein(clean, candidate);
      const threshold = clean.length <= 4 ? 1 : 2;
      if(dist <= threshold && dist < bestDist){
        best = candidate;
        bestDist = dist;
      }
    }
    return best;
  }

  function findSpellingSuggestion(text){
    const cleaned = text.trim();
    if(cleaned.length < 2) return null;

    // first, try the phrase as a whole against known full product names
    const phraseCandidates = [...new Set([...COMMON_ITEMS, ...items.map(i => i.name)])];
    for(const candidate of phraseCandidates){
      if(candidate.toLowerCase() === cleaned.toLowerCase()) return null;
    }

    // then correct every word in the sentence, not just the first one
    const dictionary = buildWordDictionary();
    const words = cleaned.split(/\s+/);
    let changed = false;

    const correctedWords = words.map(word => {
      const fix = closestWord(word, dictionary);
      if(fix && fix !== word){
        changed = true;
        return fix;
      }
      return word;
    });

    return changed ? correctedWords.join(' ') : null;
  }

  function checkSpelling(){
    const input = document.getElementById('itemName');
    const box = document.getElementById('spellSuggestion');
    const suggestion = findSpellingSuggestion(input.value);

    if(suggestion){
      box.style.display = 'flex';
      box.innerHTML = `התכוונת ל&nbsp;<strong>${escapeHtml(suggestion)}</strong>?
        <button onclick="applySuggestion('${suggestion.replace(/'/g, "\\'")}')">להשתמש בזה</button>`;
    } else {
      box.style.display = 'none';
      box.innerHTML = '';
    }
  }

  function applySuggestion(text){
    const input = document.getElementById('itemName');
    input.value = text;
    document.getElementById('spellSuggestion').style.display = 'none';
    input.focus();
  }

  function daysPassed(dateStr){
    const last = new Date(dateStr);
    const today = new Date();
    const diff = Math.abs(today - last);
    return Math.floor(diff / (1000*60*60*24));
  }

  function computePercentage(item){
    const d = daysPassed(item.lastPurchaseDate);
    return Math.min(Math.round((d / item.averageDays) * 100), 100);
  }

  function gaugeColor(pct){
    if(pct >= 90) return 'var(--tomato)';
    if(pct >= 60) return 'var(--mustard)';
    return 'var(--avocado)';
  }

  function autoSyncStatus(){
    // items that hit 100% consumption and are still marked in_stock become needed
    items.forEach(item => {
      const pct = computePercentage(item);
      if(pct >= 100 && item.status === 'in_stock'){
        item.status = 'needed';
      }
    });
  }

  function itemCardHtml(item){
    const pct = computePercentage(item);
    const dPassed = daysPassed(item.lastPurchaseDate);
    const isNeeded = item.status === 'needed';
    const stampLabel = isNeeded ? 'חסר' : 'במלאי';
    const priceControl = findPriceControlMatch(item.name);
    const community = getCommunityStats(item.name);

    return `
      <div class="item-card ${isNeeded ? 'is-needed' : ''}">
        <div class="item-top">
          <div class="buy-box" title="סמן כנקנה" role="button" tabindex="0"
               onclick="markAsBought('${item.id}')"
               onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();markAsBought('${item.id}');}">
            <span class="buy-box-mark">✕</span>
          </div>
          <div class="item-title-wrap">
            <span class="item-title">${escapeHtml(item.name)}</span>
            ${item.quantity > 1 ? `<span class="qty-badge">×${item.quantity}</span>` : ''}
            <span class="stamp ${item.status}">${stampLabel}</span>
          </div>
          <span class="item-price">
            ₪${Number(item.lastPrice).toFixed(2)}
            ${(item.previousPrice != null && item.previousPrice !== item.lastPrice) ? `
              <span class="price-trend ${item.lastPrice > item.previousPrice ? 'up' : 'down'}" title="מחיר קודם: ₪${Number(item.previousPrice).toFixed(2)}">
                ${item.lastPrice > item.previousPrice ? '▲' : '▼'} היה ₪${Number(item.previousPrice).toFixed(2)}
              </span>` : ''}
          </span>
        </div>
        <div class="gauge-row">
          <div class="gauge"><div class="gauge-fill" style="width:${pct}%; background:${gaugeColor(pct)};"></div></div>
          <span class="gauge-pct">${pct}%</span>
        </div>
        <div class="item-meta">קנייה אחרונה: לפני ${dPassed} ימים · ממוצע צריכה: ${item.averageDays} ימים</div>
        ${priceControl ? `
        <div class="price-control ${item.lastPrice > priceControl.maxPrice ? 'over' : ''}">
          🏛️ מוצר בפיקוח מחירים — מחיר מרבי ₪${priceControl.maxPrice.toFixed(2)} (${priceControl.pkg})
          ${item.lastPrice > priceControl.maxPrice ? '<br>⚠️ המחיר ששילמתם גבוה מהמחיר המרבי החוקי' : ''}
        </div>` : ''}
        ${community ? `
        <div class="community-price">
          💬 מחיר קהילתי (חציוני): ₪${community.median.toFixed(2)} · ${community.count} דיווחים (₪${community.min.toFixed(2)}–₪${community.max.toFixed(2)})
        </div>` : ''}
        <div class="item-actions">
          <button class="btn-toggle" onclick="toggleStatus('${item.id}')">${isNeeded ? 'סמן כקיים' : 'סמן כחסר'}</button>
          <button class="btn-toggle" title="ערוך שם ותדירות" onclick="editItem('${item.id}')">✎</button>
          <button class="btn-toggle" title="השווה מחיר בין רשתות" onclick="comparePriceForItem('${item.id}')">📊 השווה מחיר</button>
          <button class="btn-toggle" title="שתף את המחיר ששילמת עם כל המשתמשים" onclick="shareCommunityPrice('${item.id}')">📢 שתף מחיר</button>
          <button class="btn-del" title="מחק מוצר" onclick="deleteItem('${item.id}')">✕</button>
        </div>
      </div>
    `;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderItems(){
    if(!loaded) return;
    autoSyncStatus();

    const byUrgency = (a, b) => computePercentage(b) - computePercentage(a);
    const needed = items.filter(i => i.status === 'needed').sort(byUrgency);
    const inStock = items.filter(i => i.status === 'in_stock').sort(byUrgency);

    const neededSection = document.getElementById('neededSection');
    const stockToggle = document.getElementById('stockToggle');
    const stockSection = document.getElementById('stockSection');

    neededSection.innerHTML = needed.length
      ? `<div class="section-label">חסר בבית</div>` + needed.map(itemCardHtml).join('')
      : (items.length === 0
          ? `<div class="empty">הרשימה ריקה — הוסיפו מוצר ראשון למעלה</div>`
          : `<div class="empty">✅ הכל במלאי, שום דבר לא חסר כרגע</div>`);

    if(inStock.length === 0){
      stockToggle.innerHTML = '';
      stockSection.innerHTML = '';
    } else if(showStock){
      stockToggle.innerHTML = `<button class="stock-toggle" onclick="toggleStockView()">הסתר מוצרים במלאי ▲</button>`;
      stockSection.innerHTML = `<div class="section-label">במלאי</div>` + inStock.map(itemCardHtml).join('');
    } else {
      stockToggle.innerHTML = `<button class="stock-toggle" onclick="toggleStockView()">הצג ${inStock.length} מוצרים במלאי ▾</button>`;
      stockSection.innerHTML = '';
    }
  }

  function toggleStockView(){
    showStock = !showStock;
    renderItems();
  }

  function markAsBought(id){
    const item = items.find(i => i.id === id);
    if(!item) return;

    // learn the real consumption pace: blend the actual interval since the
    // last purchase into the average instead of leaving it fixed forever
    const interval = daysPassed(item.lastPurchaseDate);
    if(interval > 0){
      item.averageDays = Math.max(1, Math.round((item.averageDays + interval) / 2));
    }
    item.lastPurchaseDate = new Date().toISOString().slice(0,10);
    item.status = 'in_stock';
    renderItems();
    persistItems();
  }

  function editItem(id){
    const item = items.find(i => i.id === id);
    if(!item) return;
    const newName = prompt('שם המוצר:', item.name);
    if(newName === null) return;
    const trimmed = newName.trim();
    if(trimmed){
      item.name = trimmed;
    } else {
      alert('שם ריק אינו תקין — השם הקודם נשאר.');
    }

    const newAvg = prompt('כל כמה ימים בממוצע המוצר נגמר?', item.averageDays);
    if(newAvg !== null){
      const parsed = parseInt(newAvg, 10);
      if(!isNaN(parsed) && parsed > 0){
        item.averageDays = parsed;
      } else {
        alert(`"${newAvg}" אינו מספר ימים תקין — הערך הקודם (${item.averageDays}) נשאר.`);
      }
    }

    const newPrice = prompt('מחיר (₪):', item.lastPrice);
    if(newPrice !== null){
      const parsed = parseFloat(newPrice);
      if(!isNaN(parsed) && parsed >= 0){
        if(parsed !== item.lastPrice){
          item.previousPrice = item.lastPrice;
        }
        item.lastPrice = parsed;
      } else {
        alert(`"${newPrice}" אינו מחיר תקין — הערך הקודם (₪${item.lastPrice.toFixed(2)}) נשאר.`);
      }
    }
    renderItems();
    persistItems();
  }

  function toggleStatus(id){
    const item = items.find(i => i.id === id);
    if(!item) return;
    item.status = item.status === 'needed' ? 'in_stock' : 'needed';
    renderItems();
    persistItems();
  }

  function deleteItem(id){
    items = items.filter(i => i.id !== id);
    renderItems();
    persistItems();
  }

  function comparePriceForItem(id){
    const item = items.find(i => i.id === id);
    if(!item) return;
    // strip our own added details (fat %, weight suffix) for a cleaner search,
    // since the comparison site matches on the base product name
    const baseName = item.name.replace(/\s+\d+(\.\d+)?%$/, '').replace(/\s+\d+(\.\d+)?\s*(ק"ג|גרם)$/, '').trim();
    const url = 'https://oshek.co.il/search?q=' + encodeURIComponent(baseName || item.name);
    window.open(url, '_blank', 'noopener');
  }

  // --- barcode scanning ---------------------------------------------------
  let zxingControls = null;
  let scanHandled = false;

  async function openScanner(){
    const overlay = document.getElementById('scanOverlay');
    const status = document.getElementById('scanStatus');
    const video = document.getElementById('scanVideo');

    overlay.classList.add('open');
    scanHandled = false;
    status.textContent = 'טוען את מנוע הסריקה…';

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      status.textContent = 'הדפדפן הזה לא תומך בגישה למצלמה. אפשר להזין את שם המוצר ידנית.';
      return;
    }

    if(typeof ZXingBrowser === 'undefined'){
      status.textContent = 'ספריית הסריקה לא נטענה (בדקו חיבור לאינטרנט) — אפשר להזין את שם המוצר ידנית.';
      return;
    }

    status.textContent = 'מבקש הרשאת מצלמה…';

    try{
      let reader;
      if(typeof ZXing !== 'undefined' && ZXing.DecodeHintType){
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true); // spend more effort per frame, helps with low-quality/angled shots
        reader = new ZXingBrowser.BrowserMultiFormatReader(hints);
      } else {
        reader = new ZXingBrowser.BrowserMultiFormatReader();
      }

      const constraints = {
        video: {
          facingMode: { ideal: 'environment' }, // prefer the back camera
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };

      zxingControls = await reader.decodeFromConstraints(constraints, video, (result) => {
        if(result && !scanHandled){
          scanHandled = true;
          const isQr = (typeof ZXing !== 'undefined' && ZXing.BarcodeFormat)
            ? result.getBarcodeFormat() === ZXing.BarcodeFormat.QR_CODE
            : /^\d{6,14}$/.test(result.getText()) === false; // fallback guess if the enum isn't available
          handleBarcode(result.getText(), isQr);
        }
        // decode errors on frames with no barcode are expected and ignored
      });
      status.textContent = 'כוונו את הברקוד למסגרת, במרחק כ-10 ס״מ, באור טוב';
    } catch(e){
      console.error('שגיאת מצלמה/סריקה:', e);
      status.textContent = 'לא הצלחתי לגשת למצלמה (ייתכן שההרשאה נחסמה, או שאין מצלמה זמינה). אפשר להזין את שם המוצר ידנית.';
    }
  }

  function closeScanner(){
    const overlay = document.getElementById('scanOverlay');
    overlay.classList.remove('open');

    if(zxingControls){
      try{ zxingControls.stop(); } catch(e){ /* already stopped */ }
      zxingControls = null;
    }
  }

  let lastScannedBarcode = null;

  async function handleBarcode(code, isQr){
    const status = document.getElementById('scanStatus');

    if(zxingControls){ try{ zxingControls.stop(); } catch(e){} } // stop re-triggering while we look it up

    let productName = null;

    if(isQr){
      // a QR code can hold free text - if it already looks like a product
      // name (not a URL/long payload), just use it directly, no lookup needed
      const text = code.trim();
      if(text && !/^https?:\/\//i.test(text) && text.length <= 60){
        productName = text;
      }
      status.textContent = productName ? `נסרק QR: ${productName}` : 'נסרק QR, אך התוכן לא נראה כשם מוצר תקין.';
      lastScannedBarcode = null; // QR content isn't a barcode number, nothing to learn against
    } else {
      lastScannedBarcode = code; // remember it so a manual name correction below gets learned

      if(barcodeNames[code]){
        // we've seen this exact barcode before and learned its name -
        // no need to hit the external database again
        productName = barcodeNames[code];
        status.textContent = `נסרק ברקוד ${code} — נמצא שם שמור: ${productName}`;
      } else {
        status.textContent = `נסרק ברקוד ${code} — מחפש את שם המוצר…`;
        try{
          const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_he`);
          const data = await res.json();
          if(data && data.product){
            productName = data.product.product_name_he || data.product.product_name || null;
          }
        } catch(e){
          console.warn('חיפוש המוצר נכשל, ממשיכים עם מספר הברקוד בלבד:', e);
        }
        if(productName){
          barcodeNames[code] = productName; // cache it for next time
          persistBarcodeNames();
        }
      }
    }

    closeScanner();

    const input = document.getElementById('itemName');
    input.value = productName || ''; // don't dump the long barcode digits into the name field
    renderCategoryExtra();
    checkSpelling();
    input.focus();

    if(!productName){
      showFormError(`הברקוד ${code} לא נמצא במאגר — כתבו את שם המוצר ולחצו הוסף, והאפליקציה תזכור אותו לפעם הבאה.`);
    }
  }

  // --- receipt scanning (OCR) ---------------------------------------------
  function openReceiptScanner(){
    document.getElementById('receiptFileInput').click();
  }

  function closeReceiptScanner(){
    document.getElementById('receiptOverlay').classList.remove('open');
  }

  async function handleReceiptFile(event){
    const file = event.target.files[0];
    event.target.value = ''; // reset so picking the same file again still fires onchange
    if(!file) return;

    const overlay = document.getElementById('receiptOverlay');
    const status = document.getElementById('receiptStatus');
    const review = document.getElementById('receiptReview');
    const confirmBtn = document.getElementById('receiptConfirmBtn');

    overlay.classList.add('open');
    review.innerHTML = '';
    review._parsedLines = null;
    confirmBtn.style.display = 'none';
    status.textContent = 'טוען מנוע זיהוי טקסט (בפעם הראשונה זה לוקח יותר זמן)…';

    if(typeof Tesseract === 'undefined'){
      status.textContent = 'ספריית זיהוי הטקסט לא נטענה (בדקו חיבור לאינטרנט) — אפשר להוסיף מוצרים ידנית בינתיים.';
      return;
    }

    try{
      const result = await Tesseract.recognize(file, 'heb+eng', {
        logger: m => {
          if(m.status === 'recognizing text'){
            status.textContent = `מזהה טקסט… ${Math.round((m.progress || 0) * 100)}%`;
          }
        }
      });

      const lines = parseReceiptLines(result.data.text);

      if(lines.length === 0){
        status.textContent = 'לא זוהו שורות עם מחיר בתמונה. נסו לצלם שוב באור טוב, ישר, בלי קפלים בקבלה.';
        return;
      }

      status.textContent = `נמצאו ${lines.length} שורות — סמנו מה להוסיף לרשימה, ואפשר לתקן שם/מחיר לפני ההוספה:`;
      review.innerHTML = lines.map((l, idx) => `
        <label class="receipt-line">
          <input type="checkbox" checked data-idx="${idx}">
          <input type="text" class="receipt-name" value="${escapeHtml(l.name)}" data-idx="${idx}">
          <input type="number" step="0.1" class="receipt-price" value="${l.price}" data-idx="${idx}">
        </label>
      `).join('');
      review._parsedLines = lines;
      confirmBtn.style.display = 'block';

    } catch(e){
      console.error('שגיאת OCR:', e);
      status.textContent = 'משהו השתבש בזיהוי הטקסט. נסו שוב עם תמונה ברורה יותר, או הוסיפו ידנית.';
    }
  }

  function parseReceiptLines(text){
    const rawLines = text.split('\n');
    const priceRegex = /(\d{1,4}[.,]\d{2})\s*$/; // a price at the end of the line
    const skipWords = [
      'סה"כ', 'סהכ', 'total', 'מע"מ', 'מעמ', 'עודף', 'מזומן', 'אשראי',
      'תודה', 'קבלה', 'חשבונית', 'עסקה', 'תאריך', 'שעה', 'סניף', 'קופה'
    ];

    const seen = new Map(); // dedupe same product appearing twice on one receipt (usually an OCR artifact)
    for(const raw of rawLines){
      const line = raw.trim();
      if(!line || line.length < 3) continue;
      if(skipWords.some(w => line.includes(w))) continue;

      const m = line.match(priceRegex);
      if(!m) continue;

      const price = parseFloat(m[1].replace(',', '.'));
      if(isNaN(price) || price <= 0 || price > 2000) continue; // sanity range for a single line item

      let name = line.slice(0, m.index).trim();
      name = name.replace(/[\d.\sxX*×]+$/, '').trim(); // strip trailing qty/unit noise like "x2" or "1.00"
      if(!name || name.length < 2) continue;

      const key = name.toLowerCase();
      if(!seen.has(key)){
        seen.set(key, { name, price });
      }
    }
    return [...seen.values()];
  }

  function confirmReceiptImport(){
    const review = document.getElementById('receiptReview');
    const checkboxes = review.querySelectorAll('input[type="checkbox"]');
    const today = new Date().toISOString().slice(0,10);
    let importedCount = 0;

    checkboxes.forEach(cb => {
      if(!cb.checked) return;
      const idx = cb.dataset.idx;
      const nameInput = review.querySelector(`.receipt-name[data-idx="${idx}"]`);
      const priceInput = review.querySelector(`.receipt-price[data-idx="${idx}"]`);
      const name = nameInput.value.trim();
      const price = parseFloat(priceInput.value);
      if(!name || isNaN(price) || price < 0) return;

      const existing = items.find(i => i.name.toLowerCase() === name.toLowerCase());
      if(existing){
        const interval = daysPassed(existing.lastPurchaseDate);
        if(interval > 0){
          existing.averageDays = Math.max(1, Math.round((existing.averageDays + interval) / 2));
        }
        // keep the last price for comparison instead of silently losing it
        if(existing.lastPrice !== price){
          existing.previousPrice = existing.lastPrice;
        }
        existing.lastPrice = price;
        existing.lastPurchaseDate = today;
        existing.status = 'in_stock';
      } else {
        items.push({
          id: String(Date.now()) + Math.random().toString(36).slice(2, 6),
          name, status: 'in_stock', lastPurchaseDate: today,
          averageDays: 7, lastPrice: price, quantity: 1, previousPrice: null
        });
      }
      importedCount++;
    });

    closeReceiptScanner();
    renderItems();
    persistItems();
    showFormError(importedCount > 0
      ? `יובאו ${importedCount} מוצרים מהחשבונית (סומנו כ"במלאי").`
      : 'לא סומן אף מוצר לייבוא.');
  }

  function shareToWhatsApp(){
    const needed = items.filter(i => i.status === 'needed');
    const source = needed.length ? needed : items;
    const heading = needed.length ? '🛒 רשימת קניות - חסר בבית:' : '🛒 רשימת קניות:';

    if(source.length === 0){
      alert('הרשימה ריקה, אין מה לשתף כרגע.');
      return;
    }

    // sharing only makes sense with a family list - a personal list's link
    // would just give the recipient their own separate empty list
    if(listMode === 'personal'){
      const wantsFamily = confirm('כרגע זו רשימה אישית. כדי שהצד השני יוכל לראות ולערוך את אותה רשימה, נהפוך אותה לרשימה משפחתית משותפת. להמשיך?');
      if(!wantsFamily) return;
      createFamilyList();
      // switchMode() reloads data async - give it a moment before sharing the link
      setTimeout(() => shareToWhatsApp(), 600);
      return;
    }

    const lines = source.map(i => `• ${i.name}${i.quantity > 1 ? ` (×${i.quantity})` : ''}`);
    const siteUrl = window.location.href;
    const canShareLink = /^https?:\/\//i.test(siteUrl); // skip odd internal URLs (e.g. inside Claude's preview)

    const parts = [heading, ...lines];
    if(canShareLink){
      parts.push('', `📱 לצפייה ועריכה חיה (אפשר גם להוסיף מוצרים): ${siteUrl}`);
    }

    const text = parts.join('\n');
    const url = 'https://wa.me/?text=' + encodeURIComponent(text);
    window.open(url, '_blank');
  }

  function stepQuantity(delta){
    const qtyInput = document.getElementById('itemQty');
    const current = parseInt(qtyInput.value, 10) || 1;
    qtyInput.value = Math.max(1, current + delta);
  }

  function readQuantity(){
    const qtyInput = document.getElementById('itemQty');
    const parsed = parseInt(qtyInput.value, 10);
    return (!isNaN(parsed) && parsed >= 1) ? parsed : 1;
  }

  function addItem(){
    const input = document.getElementById('itemName');
    const baseName = input.value.trim();
    showFormError('');

    if(!baseName){
      showFormError('צריך להזין שם מוצר לפני ההוספה.');
      return;
    }

    const name = (baseName + categorySuffix()).trim();
    const quantity = readQuantity();

    // if this add follows a barcode scan, remember whatever name the person
    // actually confirmed - even if it differs from (or replaces a missing)
    // API lookup, so scanning this exact product again is instant
    if(lastScannedBarcode){
      if(barcodeNames[lastScannedBarcode] !== baseName){
        barcodeNames[lastScannedBarcode] = baseName;
        persistBarcodeNames();
      }
      lastScannedBarcode = null;
    }

    const existing = items.find(i => i.name.toLowerCase() === name.toLowerCase());
    if(existing){
      // re-adding an item you already had is itself a signal: the gap
      // between its last purchase and right now is real data about how
      // fast you actually go through it, so blend it into the average
      const interval = daysPassed(existing.lastPurchaseDate);
      if(interval > 0){
        existing.averageDays = Math.max(1, Math.round((existing.averageDays + interval) / 2));
      }
      existing.status = 'needed';
      existing.quantity = quantity;
      showFormError(`"${existing.name}" כבר ברשימה — סימנתי אותו כחסר ועדכנתי את קצב הצריכה (${existing.averageDays} ימים בממוצע).`);
      input.value = '';
      document.getElementById('itemQty').value = 1;
      renderCategoryExtra();
      renderItems();
      persistItems();
      return;
    }

    items.push({
      id: String(Date.now()),
      name: name,
      status: 'needed',
      lastPurchaseDate: new Date().toISOString().slice(0,10),
      averageDays: 7,
      lastPrice: 0,
      quantity: quantity
    });
    input.value = '';
    document.getElementById('itemQty').value = 1;
    document.getElementById('spellSuggestion').style.display = 'none';
    renderCategoryExtra();
    renderItems();
    persistItems();
  }

  // --- accessibility widget: font scaling + read-aloud -------------------
  let a11yFontLevel = 0;
  const A11Y_FONT_CLASSES = ['', 'a11y-large', 'a11y-xlarge'];

  function toggleA11yMenu(){
    document.getElementById('a11yMenu').classList.toggle('open');
  }

  function cycleFontSize(){
    a11yFontLevel = (a11yFontLevel + 1) % A11Y_FONT_CLASSES.length;
    document.documentElement.className = A11Y_FONT_CLASSES[a11yFontLevel];
  }

  function resetFontSize(){
    a11yFontLevel = 0;
    document.documentElement.className = '';
  }

  function speakList(){
    if(!('speechSynthesis' in window)){
      alert('הדפדפן הזה לא תומך בהקראה קולית.');
      return;
    }

    const needed = items.filter(i => i.status === 'needed');
    const source = needed.length ? needed : items;
    if(source.length === 0){
      alert('הרשימה ריקה, אין מה להקריא.');
      return;
    }

    const heading = needed.length ? 'ברשימת החסר בבית' : 'ברשימת הקניות';
    const spoken = source
      .map(i => i.quantity > 1 ? `${i.name}, כמות ${i.quantity}` : i.name)
      .join('. ');

    window.speechSynthesis.cancel(); // stop any previous reading first
    const utterance = new SpeechSynthesisUtterance(`${heading}: ${spoken}.`);
    utterance.lang = 'he-IL';
    utterance.rate = 0.95;
    window.speechSynthesis.speak(utterance);

    document.getElementById('a11yMenu').classList.remove('open');
  }

  // close the accessibility menu when clicking outside it
  document.addEventListener('click', (e) => {
    const widget = document.querySelector('.a11y-widget');
    const menu = document.getElementById('a11yMenu');
    if(widget && menu && !widget.contains(e.target)){
      menu.classList.remove('open');
    }
  });

  // --- AI chat about the list ---------------------------------------------
  function toggleAiChat(){
    document.getElementById('aiPanel').classList.toggle('open');
  }

  function buildListContext(){
    const needed = items.filter(i => i.status === 'needed').map(i => i.name);
    const inStock = items.filter(i => i.status === 'in_stock').map(i => i.name);
    return `הרשימה הנוכחית של המשתמש באפליקציית רשימת קניות:\n` +
      `חסר בבית (צריך לקנות): ${needed.length ? needed.join(', ') : 'אין'}\n` +
      `יש כרגע בבית (במלאי): ${inStock.length ? inStock.join(', ') : 'אין'}\n\n` +
      `ענה למשתמש בעברית, בקצרה וברור, בהתבסס על המידע הזה בלבד.\n\n` +
      `אם המשתמש שואל מה צריך לקנות כדי להכין מנה/מתכון מסוים (לדוגמה "אני רוצה להכין לזניה, מה אני צריך"), ` +
      `ענה קודם בכמה מילים ידידותיות, ואז בשורה נפרדת ואחרונה בתשובה, הוסף בדיוק בפורמט הזה ` +
      `רשימת מצרכים שחסרים למשתמש (אל תכלול מצרכים שכבר "יש כרגע בבית"), מופרדים בפסיקים, בלי מספור ובלי תוספות:\n` +
      `ITEMS_TO_ADD: מוצר1, מוצר2, מוצר3\n` +
      `כברירת מחדל, העדף גרסה פשוטה, זולה ונפוצה של המתכון (מרכיבים בסיסיים וקלים למציאה בסופר רגיל), ` +
      `אלא אם המשתמש ביקש במפורש גרסה יוקרתית/מיוחדת. אם המשתמש ציין תקציב או ביקש לחסוך בכסף, קח זאת בחשבון בבחירת המרכיבים.\n` +
      `אם השאלה לא קשורה לקניית מצרכים למתכון, אל תוסיף את השורה הזו בכלל.`;
  }

  function getAiApiKey(){
    return localStorage.getItem('shopping-list-gemini-key') || null;
  }

  function ensureAiApiKey(){
    let key = getAiApiKey();
    if(key) return key;
    key = prompt(
      'כדי להשתמש בצ\'אט ה-AI, צריך מפתח API אישי וחינמי מגוגל (Gemini) - בלי כרטיס אשראי.\n' +
      'קבלו אחד תוך דקה ב: aistudio.google.com/apikey\n\n' +
      'המפתח נשמר רק במכשיר הזה ונשלח ישירות לגוגל בלבד - לא דרכנו ולא לאף אחד אחר.\n\n' +
      'הדביקו כאן את מפתח ה-API שלכם:'
    );
    if(key && key.trim()){
      localStorage.setItem('shopping-list-gemini-key', key.trim());
      return key.trim();
    }
    return null;
  }

  async function callAI(userMessage){
    const context = buildListContext();
    const fullPrompt = `${context}\n\nהמשתמש שואל: ${userMessage}`;

    if(usingClaudeStorage){
      // running inside a Claude artifact - Anthropic handles the API key,
      // never pass one in here
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          messages: [{ role: 'user', content: fullPrompt }]
        })
      });
      const data = await response.json();
      return data.content.filter(b => b.type === 'text').map(b => b.text).join('\n');
    }

    // hosted outside Claude - use Google Gemini's free tier with the
    // person's own free API key, so nobody pays anything
    const apiKey = ensureAiApiKey();
    if(!apiKey) return null;

    let response;
    try{
      response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: fullPrompt }] }]
          })
        }
      );
    } catch(networkErr){
      // fetch throws a generic error on CORS failures with no useful detail
      throw new Error('לא הצלחתי להתחבר ל-Gemini (ייתכן שזו חסימת דפדפן/CORS). נסו לרענן ולנסות שוב.');
    }

    if(!response.ok){
      const errBody = await response.json().catch(() => null);
      const realMessage = (errBody && errBody.error && errBody.error.message) || `שגיאה ${response.status} מ-Gemini.`;
      if(response.status === 400 || response.status === 403){
        localStorage.removeItem('shopping-list-gemini-key'); // clear the key so next try re-prompts, in case it really was the key
      }
      throw new Error(realMessage);
    }

    const data = await response.json();
    const candidate = data.candidates && data.candidates[0];
    const parts = candidate && candidate.content && candidate.content.parts;
    return parts ? parts.map(p => p.text || '').join('\n') : '';
  }

  function appendAiMessage(role, text, loading){
    const box = document.getElementById('aiMessages');
    const div = document.createElement('div');
    div.className = 'ai-msg ' + role + (loading ? ' loading' : '');
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }

  function parseAiReply(reply){
    const match = reply.match(/ITEMS_TO_ADD:\s*(.+)\s*$/);
    if(!match){
      return { text: reply.trim(), suggestedItems: [] };
    }
    const text = reply.slice(0, match.index).trim();
    const suggestedItems = match[1]
      .split(',')
      .map(s => s.trim())
      .filter(Boolean)
      // don't suggest something that's already on the list either way
      .filter(name => !items.some(i => i.name.toLowerCase() === name.toLowerCase()));
    return { text, suggestedItems };
  }

  function renderAiSuggestions(container, suggestedItems){
    if(suggestedItems.length === 0) return;

    const box = document.createElement('div');
    box.className = 'ai-suggestions';
    box.innerHTML = `
      <div class="ai-suggestions-label">🛒 להוסיף לרשימה?</div>
      ${suggestedItems.map((name, idx) => `
        <label class="ai-suggestion-line">
          <input type="checkbox" checked data-idx="${idx}">
          <span>${escapeHtml(name)}</span>
        </label>
      `).join('')}
      <button class="ai-add-btn">➕ הוסף מסומנים</button>
    `;

    box.querySelector('.ai-add-btn').addEventListener('click', () => {
      const checked = [...box.querySelectorAll('input[type="checkbox"]:checked')]
        .map(cb => suggestedItems[cb.dataset.idx]);

      let addedCount = 0;
      checked.forEach(name => {
        if(items.some(i => i.name.toLowerCase() === name.toLowerCase())) return; // avoid duplicates
        items.push({
          id: String(Date.now()) + Math.random().toString(36).slice(2, 6),
          name, status: 'needed', lastPurchaseDate: new Date().toISOString().slice(0,10),
          averageDays: 7, lastPrice: 0, quantity: 1
        });
        addedCount++;
      });

      if(addedCount > 0){
        renderItems();
        persistItems();
      }
      box.innerHTML = `<div class="ai-suggestions-label">✓ נוספו ${addedCount} מוצרים לרשימה</div>`;
    });

    container.appendChild(box);
  }

  async function sendAiMessage(){
    const input = document.getElementById('aiInput');
    const text = input.value.trim();
    if(!text) return;
    input.value = '';

    appendAiMessage('user', text);
    const loadingMsg = appendAiMessage('assistant', 'חושב/ת…', true);

    try{
      const reply = await callAI(text);
      if(reply === null){
        loadingMsg.remove(); // user cancelled the API-key prompt
        return;
      }
      const { text: replyText, suggestedItems } = parseAiReply(reply || 'לא הצלחתי לקבל תשובה, נסו שוב.');
      loadingMsg.textContent = replyText;
      loadingMsg.classList.remove('loading');
      renderAiSuggestions(loadingMsg.parentElement, suggestedItems);
    } catch(e){
      console.error('שגיאת AI:', e);
      loadingMsg.textContent = '❌ ' + (e.message || 'שגיאה בפנייה ל-AI.');
      loadingMsg.classList.remove('loading');
    }
  }

  document.getElementById('aiInput').addEventListener('keypress', e => {
    if(e.key === 'Enter') sendAiMessage();
  });

  document.getElementById('itemName').addEventListener('keypress', e => {
    if(e.key === 'Enter') addItem();
  });
  document.getElementById('itemName').addEventListener('input', () => {
    showFormError('');
    checkSpelling();
    renderCategoryExtra();
  });

  loadItems();
  loadBarcodeNames();
  loadCommunityPrices();
  ensureDeviceId();
</script>
